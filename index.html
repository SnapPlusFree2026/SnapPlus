<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <meta name="description" content="SnapPlus — Commence simplement et rapidement.">

  <title>SnapPlus — Commencer</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <main class="card">

    <div class="logo" aria-hidden="true">✦</div>

    <p class="brand">SNAPPLUS</p>

    <p class="eyebrow">BIENVENUE</p>

    <h1>Commencer</h1>

    <p class="subtitle">
      Choisis ton pseudo pour commencer ton aventure sur SnapPlus.
    </p>

    <form id="pseudoForm" novalidate>

      <label for="pseudo" class="field-label">
        Pseudo
      </label>

      <div class="input-wrapper">
        <span class="at-symbol" aria-hidden="true">@</span>

        <input
          id="pseudo"
          name="pseudo"
          type="text"
          maxlength="32"
          placeholder="TonPseudo"
          autocomplete="off"
          required
        >
      </div>

      <p
        id="errorMessage"
        class="error-message"
        role="alert"
        aria-live="polite"
      ></p>

      <button id="submitButton" type="submit">
        <span class="button-text">Continuer →</span>
      </button>

    </form>

    <footer>
      Simple <span>•</span> Rapide <span>•</span> Gratuit
    </footer>

  </main>

  <script src="script.js"></script>

</body>
</html>
